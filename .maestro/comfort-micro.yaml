appId: com.tysonhu.eazyreview.dev
name: Comfort unrated to 0.5 with exactly one increment
---
- assertVisible:
    id: rate-dim-comfort-value
    text: ".*, not rated"
- assertVisible:
    id: rate-dim-comfort-inc
- takeScreenshot: comfort-before-tap
- tapOn:
    id: rate-dim-comfort-inc
    retryTapIfNoChange: false
- takeScreenshot: comfort-after-tap
- assertVisible:
    id: rate-dim-comfort-value
    text: ".*, 0.5 of 10"
