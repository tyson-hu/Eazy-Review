name: Bug report
description: Report a reproducible problem with Eazy Review.
body:
  - type: markdown
    attributes:
      value: |
        For vulnerabilities, use [private reporting](https://github.com/tyson-hu/Eazy-Review/security/advisories/new).
        Do not include credentials, environment files, recovery links, private notes or personal account information.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the screen or journey and the smallest repeatable steps.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: App commit or version, OS version, web browser or native development/Release build, and local backend context. No keys or URLs containing credentials.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Optional screenshots or relevant error text. Remove secrets and personal data before sharing.
