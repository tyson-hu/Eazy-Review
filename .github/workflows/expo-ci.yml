name: Expo CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Pin npm
        working-directory: ${{ runner.temp }}
        run: npm install --global --ignore-scripts npm@11.17.0

      - name: Verify npm
        run: npm --version

      - name: Install dependencies
        run: npm ci

      - name: Prepare typed routes and config
        run: npm run prepare:routes

      - name: Fail on tracked route/config drift
        run: git diff --exit-code -- tsconfig.json

      - name: Run read-only repository checks
        run: npm run check:readonly

      - name: Expo doctor
        run: npx expo-doctor

      - name: Expo dependency check
        run: npx expo install --check

      - name: Export web bundle
        run: CI=1 npx expo export --platform web

      - name: Check whitespace errors
        run: git diff --check
