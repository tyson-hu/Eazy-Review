name: Expo CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Pin npm
        working-directory: ${{ runner.temp }}
        run: npm install --global --ignore-scripts npm@11.17.0

      - name: Verify npm
        run: npm --version

      - name: Install dependencies
        run: npm ci

      - name: Check skill wrapper contract
        run: npm run check:skill-wrappers

      - name: Check decision records and generated index
        run: npm run decisions:check

      - name: Secret scan and self-test
        run: npm run check:secrets

      - name: Generate typed routes
        run: npm run generate:routes

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Expo doctor
        run: npx expo-doctor

      - name: Expo dependency check
        run: npx expo install --check

      - name: Export web bundle
        run: CI=1 npx expo export --platform web

      - name: Check whitespace errors
        run: git diff --check
