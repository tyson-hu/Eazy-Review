name: Database CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - ".github/workflows/database-ci.yml"
      - ".npmrc"
      - "package-lock.json"
      - "package.json"
      - "scripts/check-task13-seed-reapply.cjs"
      - "scripts/generate-database-types.cjs"
      - "scripts/test-db-*.cjs"
      - "src/types/database.generated.ts"
      - "supabase/**"
      - "tsconfig.json"
      - "eslint.config.js"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/database-ci.yml"
      - ".npmrc"
      - "package-lock.json"
      - "package.json"
      - "scripts/check-task13-seed-reapply.cjs"
      - "scripts/generate-database-types.cjs"
      - "scripts/test-db-*.cjs"
      - "src/types/database.generated.ts"
      - "supabase/**"
      - "tsconfig.json"
      - "eslint.config.js"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  database:
    # Draft conversion cancels prior work; readiness runs the same head without a new commit.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DO_NOT_TRACK: "1"
      # supabase/config.toml reads this non-secret Auth origin. CI stays local;
      # physical devices override it from the gitignored root .env.
      SUPABASE_AUTH_EXTERNAL_URL: http://127.0.0.1:54321/auth/v1

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Pin npm
        working-directory: ${{ runner.temp }}
        run: npm install --global --ignore-scripts npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.1.14
          cache: true

      - name: Check Edge Functions
        run: npm run check:functions

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2
        with:
          version: 2.110.0

      - name: Start local Supabase without logging generated credentials
        run: supabase start >/dev/null

      - name: Reset database and run pgTAP plus concurrency tests
        run: npm run test:db:reset

      - name: Check generated database types match local schema
        run: npm run types:check

      - name: Stop local Supabase and remove CI volumes
        if: always()
        run: supabase stop --no-backup
