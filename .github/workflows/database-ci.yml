name: Database CI

on:
  pull_request:
    paths:
      - ".github/workflows/database-ci.yml"
      - ".npmrc"
      - "package-lock.json"
      - "package.json"
      - "scripts/check-task13-seed-reapply.cjs"
      - "scripts/generate-database-types.cjs"
      - "scripts/test-db-*.cjs"
      - "src/types/database.generated.ts"
      - "supabase/**"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/database-ci.yml"
      - ".npmrc"
      - "package-lock.json"
      - "package.json"
      - "scripts/check-task13-seed-reapply.cjs"
      - "scripts/generate-database-types.cjs"
      - "scripts/test-db-*.cjs"
      - "src/types/database.generated.ts"
      - "supabase/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DO_NOT_TRACK: "1"
      # supabase/config.toml reads this non-secret Auth origin. CI stays local;
      # physical devices override it from the gitignored root .env.
      SUPABASE_AUTH_EXTERNAL_URL: http://127.0.0.1:54321/auth/v1

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Pin npm
        working-directory: ${{ runner.temp }}
        run: npm install --global --ignore-scripts npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.110.0

      - name: Start local Supabase without logging generated credentials
        run: supabase start >/dev/null

      - name: Reset database and run pgTAP plus concurrency tests
        run: npm run test:db:reset

      - name: Check generated database types match local schema
        run: npm run types:check

      - name: Stop local Supabase and remove CI volumes
        if: always()
        run: supabase stop --no-backup
